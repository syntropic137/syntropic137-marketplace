id: code-review
name: "Code Review"
description: "Analyze a pull request and provide actionable review feedback"
type: review
classification: simple

requires_repos: true

inputs:
  - name: pr_number
    description: "Pull request number to review"
    required: true
  - name: branch
    description: "Head branch of the pull request"
    required: true
  - name: base_branch
    description: "Base branch the PR targets"
    required: false
    default: "main"
  - name: title
    description: "Pull request title for context"
    required: false

phases:
  - id: analyze
    name: "Analyze Changes"
    order: 1
    execution_type: sequential
    prompt_file: phases/analyze.md
    input_artifacts: []
    output_artifacts:
      - findings
    allowed_tools:
      - bash
      - git
      - read

  - id: report
    name: "Write Review"
    order: 2
    execution_type: sequential
    prompt_file: phases/report.md
    input_artifacts:
      - analyze
    output_artifacts:
      - review
    allowed_tools:
      - bash
      - git
