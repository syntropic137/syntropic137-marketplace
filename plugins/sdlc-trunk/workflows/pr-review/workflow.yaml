id: sdlc-pr-review
name: "PR Review"
description: "Comprehensive pull request review — architecture, security, testing, and style"
type: review
classification: standard

repository:
  url: "https://github.com/{{repository}}"
  ref: "{{branch}}"

inputs:
  - name: pr_number
    description: "Pull request number"
    required: true
  - name: repository
    description: "Repository in owner/repo format"
    required: true
  - name: branch
    description: "Head branch of the pull request"
    required: true
  - name: base_branch
    description: "Base branch the PR targets"
    required: false
    default: "main"
  - name: title
    description: "Pull request title"
    required: false
  - name: author
    description: "PR author username"
    required: false

phases:
  - id: context
    name: "Gather Context"
    order: 1
    execution_type: sequential
    prompt_file: phases/context.md
    input_artifacts: []
    output_artifacts:
      - pr-context
    allowed_tools:
      - bash
      - git
      - read

  - id: analyze
    name: "Deep Analysis"
    order: 2
    execution_type: sequential
    prompt_file: phases/analyze.md
    input_artifacts:
      - context
    output_artifacts:
      - findings
    allowed_tools:
      - bash
      - git
      - read

  - id: report
    name: "Post Review"
    order: 3
    execution_type: sequential
    prompt_file: phases/report.md
    input_artifacts:
      - analyze
    output_artifacts:
      - review
    allowed_tools:
      - bash
      - git
